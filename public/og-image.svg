<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#d8d8dc" />
    </linearGradient>
    <linearGradient id="plateShine" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="#0a0a0c" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Hairline border inset -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1a1a1e" stroke-width="1" />

  <!-- Logo + wordmark lockup, horizontally centered -->
  <g transform="translate(476 140)">
    <!-- 72x72 squircle app icon -->
    <rect x="0" y="3" width="72" height="72" rx="11.25" fill="#000000" fill-opacity="0.5" filter="blur(8px)" />
    <rect width="72" height="72" rx="11.25" fill="url(#plate)" />
    <rect width="72" height="72" rx="11.25" fill="url(#plateShine)" />
    <rect width="72" height="72" rx="11.25" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="0.5" />
    <!-- webimg mark, centered in the 72 squircle -->
    <g transform="translate(9 10.8) scale(1.8)" fill="#1c1c1e">
      <path d="M21.3708 0.812522C21.9057 0.270996 22.5471 0 23.2949 0C24.043 0 24.6816 0.265637 25.2114 0.79691C25.7412 1.32815 26.0059 1.96878 26.0059 2.7188C26.0059 3.50007 25.7385 4.16415 25.2036 4.71103C24.6687 5.25792 24.022 5.53135 23.2636 5.53135C22.5264 5.53135 21.8928 5.26326 21.363 4.72663C20.8332 4.19026 20.5683 3.54183 20.5683 2.7813C20.5683 2.01054 20.8359 1.3543 21.3708 0.812522Z" />
      <path d="M25.4278 19.1103V6.99985H29.791L25.4278 19.1103Z" />
      <path d="M4.41264 6.99985L7.83524 16.5625L11.4464 6.99985H14.0011L17.6789 16.6723L21.097 6.99985H21.1621V24H16.4754L12.7416 14.3123L9.11598 24H6.41289L0.209926 6.99985H4.41264Z" />
    </g>
    <!-- "webimg" wordmark in monospace -->
    <text
      x="90"
      y="50"
      font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="44"
      font-weight="500"
      fill="#fafafa"
    >webimg</text>
  </g>

  <!-- Headline, from the hero -->
  <text
    x="600"
    y="320"
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#fafafa"
    text-anchor="middle"
    letter-spacing="-1"
  >Crop, resize, convert, and compress</text>
  <text
    x="600"
    y="378"
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#fafafa"
    text-anchor="middle"
    letter-spacing="-1"
  >images in your browser</text>

  <!-- Trust line, from the hero -->
  <text
    x="600"
    y="478"
    font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="16"
    font-weight="500"
    fill="#8a8a90"
    text-anchor="middle"
    letter-spacing="1.5"
  >FREE · NO SIGN-UP · NOTHING UPLOADED · NO WATERMARKS</text>
</svg>
