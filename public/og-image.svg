<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#d8d8dc" />
    </linearGradient>
    <linearGradient id="plateShine" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="#0a0a0c" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Hairline border inset -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1a1a1e" stroke-width="1" />

  <!-- Logo + wordmark lockup, horizontally centered -->
  <g transform="translate(476 140)">
    <!-- 72x72 squircle app icon -->
    <rect x="0" y="3" width="72" height="72" rx="11.25" fill="#000000" fill-opacity="0.5" filter="blur(8px)" />
    <rect width="72" height="72" rx="11.25" fill="url(#plate)" />
    <rect width="72" height="72" rx="11.25" fill="url(#plateShine)" />
    <rect width="72" height="72" rx="11.25" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="0.5" />
    <!-- webimg mark, positioned for the 512 squircle, scaled to 72 -->
    <g transform="scale(0.140625)" fill="#1c1c1e">
      <path d="M140.62 195.5H75.5106C69.535 195.5 65.6688 201.813 68.3845 207.136L168.831 404.011C171.589 409.417 179.126 409.904 182.556 404.898L221.219 348.481C222.898 346.033 223.082 342.856 221.698 340.23L147.698 199.771C146.314 197.144 143.589 195.5 140.62 195.5Z" />
      <path d="M310.085 404.011L209.639 207.136C206.923 201.813 210.789 195.5 216.765 195.5H282.36C285.337 195.5 288.067 197.153 289.448 199.79L362.97 340.237C364.344 342.86 364.156 346.027 362.482 348.469L323.811 404.898C320.38 409.904 312.843 409.417 310.085 404.011Z" />
      <path d="M436.454 195.5H357.892C351.945 195.5 348.077 201.758 350.737 207.078L384.301 274.206C387.044 279.692 394.686 280.177 398.101 275.083L443.099 207.954C446.662 202.639 442.853 195.5 436.454 195.5Z" />
      <path d="M299 126C299 149.748 279.748 169 256 169C232.252 169 213 149.748 213 126C213 102.252 232.252 83 256 83C279.748 83 299 102.252 299 126Z" />
    </g>
    <!-- "webimg" wordmark in monospace -->
    <text
      x="90"
      y="50"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="44"
      font-weight="500"
      fill="#fafafa"
    >webimg</text>
  </g>

  <!-- Headline, from the hero -->
  <text
    x="600"
    y="320"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#fafafa"
    text-anchor="middle"
    letter-spacing="-1"
  >Crop, resize, convert, and compress</text>
  <text
    x="600"
    y="378"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    font-size="48"
    font-weight="700"
    fill="#fafafa"
    text-anchor="middle"
    letter-spacing="-1"
  >images in your browser</text>

  <!-- Trust line, from the hero -->
  <text
    x="600"
    y="478"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="16"
    font-weight="500"
    fill="#8a8a90"
    text-anchor="middle"
    letter-spacing="1.5"
  >FREE · NO SIGN-UP · NOTHING UPLOADED · NO WATERMARKS</text>
</svg>
