<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="20%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa" />
      <stop offset="100%" stop-color="#d8d8dc" />
    </linearGradient>
    <linearGradient id="plateShine" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="#0a0a0c" />
  <rect width="1200" height="630" fill="url(#dots)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Hairline border inset -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#1a1a1e" stroke-width="1" />

  <!-- App icon: 220x220 squircle -->
  <g transform="translate(96 205)">
    <!-- Drop shadow -->
    <rect x="0" y="6" width="220" height="220" rx="49.28" fill="#000000" fill-opacity="0.5" filter="blur(16px)" />
    <!-- Plate -->
    <rect width="220" height="220" rx="49.28" fill="url(#plate)" />
    <rect width="220" height="220" rx="49.28" fill="url(#plateShine)" />
    <rect width="220" height="220" rx="49.28" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="0.5" />
    <!-- Geometric mark, ~58% of plate (127.6px), centered -->
    <g transform="translate(46.2 46.2) scale(0.4984)" fill="#0a0a0c">
      <path d="M256 64V128H192.5L160 95L128 64L96 95L63.5 128H64L128 192V256H64.5L32 223L0 192V64L64 0H192L256 64ZM256 192V256H192.5L160 223L128 192V128H192L256 192Z" />
    </g>
  </g>

  <!-- Wordmark + tagline + features -->
  <g transform="translate(376 0)">
    <!-- "webimg" wordmark, custom letterforms wouldn't render reliably without fonts,
         so we use bold system font; resvg falls back gracefully -->
    <text
      x="0"
      y="298"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="124"
      font-weight="700"
      fill="#fafafa"
      letter-spacing="-5"
    >webimg</text>

    <!-- Hairline accent -->
    <rect x="4" y="328" width="56" height="3" fill="#3a3a40" />

    <!-- Tagline -->
    <text
      x="4"
      y="392"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
      font-size="34"
      font-weight="400"
      fill="#a1a1a6"
      letter-spacing="-0.4"
    >Image editor for developers</text>

    <!-- Feature pills -->
    <g transform="translate(4 432)">
      <!-- Pill: Crop -->
      <g transform="translate(0 0)">
        <rect width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.5" />
        <text x="46" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#a1a1a6" text-anchor="middle">Crop</text>
      </g>
      <g transform="translate(102 0)">
        <rect width="98" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.5" />
        <text x="49" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#a1a1a6" text-anchor="middle">Resize</text>
      </g>
      <g transform="translate(210 0)">
        <rect width="108" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.5" />
        <text x="54" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#a1a1a6" text-anchor="middle">Convert</text>
      </g>
      <g transform="translate(328 0)">
        <rect width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.09" stroke-width="0.5" />
        <text x="46" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="500" fill="#a1a1a6" text-anchor="middle">Batch</text>
      </g>
    </g>
  </g>

  <!-- Bottom-right footer -->
  <g transform="translate(1104 580)">
    <text
      x="0"
      y="0"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
      font-size="14"
      font-weight="500"
      fill="#6e6e73"
      text-anchor="end"
      letter-spacing="2"
    >LOCAL · CLIENT-SIDE · NO UPLOAD</text>
  </g>

  <!-- Top-right small format chips -->
  <g transform="translate(1104 64)" text-anchor="end">
    <g transform="translate(-280 0)">
      <rect width="56" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" />
      <text x="28" y="15" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#8a8a90" text-anchor="middle" letter-spacing="0.5">JPEG</text>
    </g>
    <g transform="translate(-216 0)">
      <rect width="50" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" />
      <text x="25" y="15" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#8a8a90" text-anchor="middle" letter-spacing="0.5">PNG</text>
    </g>
    <g transform="translate(-158 0)">
      <rect width="58" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" />
      <text x="29" y="15" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#8a8a90" text-anchor="middle" letter-spacing="0.5">WebP</text>
    </g>
    <g transform="translate(-92 0)">
      <rect width="56" height="22" rx="11" fill="#ffffff" fill-opacity="0.05" />
      <text x="28" y="15" font-family="ui-monospace, monospace" font-size="11" font-weight="500" fill="#8a8a90" text-anchor="middle" letter-spacing="0.5">AVIF</text>
    </g>
  </g>
</svg>
