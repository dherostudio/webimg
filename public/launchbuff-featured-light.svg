<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 80" width="256" height="80" role="img" aria-label="Featured on LaunchBuff Badge">

  <!-- Single background — hero section cool off-white oklch(0.974 0.004 252) -->
  <rect width="256" height="80" rx="12" fill="#f5f5f8"/>

  <!-- LB logomark: left=dark, top-right=orange, bottom-right=dark -->
  <rect x="12" y="25" width="13" height="30" rx="2" fill="#1b1c24"/>
  <rect x="27" y="25" width="13" height="18" rx="2" fill="#e67f00"/>
  <rect x="27" y="45" width="13" height="10" rx="2" fill="#1b1c24"/>

  <!-- Separator -->
  <line x1="52" y1="12" x2="52" y2="68" stroke="#e67f00" stroke-width="1" opacity="0.3"/>

  <!-- Featured On label -->
  <text x="154" y="34"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="2"
    fill="#1b1c24">Featured On</text>

  <!-- LAUNCHBUFF wordmark -->
  <text x="154" y="57"
    text-anchor="middle"
    font-family="'Arial Black', Impact, 'Helvetica Neue', sans-serif"
    font-size="20"
    font-weight="900"
    letter-spacing="0.5">
    <tspan fill="#1b1c24">LAUNCH</tspan><tspan fill="#e67f00">BUFF</tspan>
  </text>

  <!-- Border -->
  <rect width="256" height="80" rx="12" fill="none" stroke="#1b1c24" stroke-width="1.5" opacity="0.12"/>
</svg>
